<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Gas pump body -->
  <rect x="12" y="10" width="28" height="46" rx="4" fill="#00a0e9" />
  <!-- Pump base -->
  <rect x="8" y="52" width="36" height="4" rx="2" fill="#0080c0" />
  <!-- Screen/Meter inside pump -->
  <rect x="17" y="16" width="18" height="13" rx="2" fill="#ffffff" />
  <!-- Meter lines -->
  <line x1="20" y1="21" x2="32" y2="21" stroke="#00a0e9" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="25" x2="28" y2="25" stroke="#00a0e9" stroke-width="1.5" stroke-linecap="round" />
  <!-- Hose from right side -->
  <path d="M 40 24 C 48 24 50 32 50 42 C 50 48 47 50 45 46 L 45 32 C 45 28 48 26 51 26 L 53 26" stroke="#00a0e9" stroke-width="3" stroke-linecap="round" fill="none" />
  <!-- Nozzle -->
  <path d="M 50 22 L 53 26 L 49 30" stroke="#00a0e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="43" y="32" width="4" height="12" rx="1.5" fill="#0080c0" />
</svg>
